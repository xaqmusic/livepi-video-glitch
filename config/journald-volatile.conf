# Log to RAM, not the SD card. Installed to
# /etc/systemd/journald.conf.d/livepi-volatile.conf.
#
# On the read-only-root appliance the journal has nowhere persistent to go
# anyway (/var/log is on the RO root), and writing logs to flash on every
# boot is exactly the kind of wear + power-yank corruption the RO root exists
# to avoid. Storage=volatile keeps the journal in /run (tmpfs); it's lost on
# reboot, which is fine for a gig appliance (debugging is live via
# `journalctl` while it's running). Capped so logs can't exhaust RAM.
[Journal]
Storage=volatile
RuntimeMaxUse=32M
