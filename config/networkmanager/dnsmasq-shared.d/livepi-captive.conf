# Captive-portal DNS hijack for the LivePi control-network AP.
#
# Installed to /etc/NetworkManager/dnsmasq-shared.d/, this is picked up by the
# dnsmasq instance NetworkManager runs for a shared-mode ("ipv4.method
# shared") connection -- i.e. only our AP. It points each OS's dedicated
# connectivity-check domain at the AP gateway (10.42.0.1) so the check fails
# and the phone pops its "Sign in to network" browser at the LivePi UI (see
# backend/livepi_backend/captive.py + config/livepi-captive.nft).
#
# ONLY these dedicated probe domains are hijacked, so AP clients keep real
# internet for everything else. Nothing here affects the box's own DNS or a
# venue-client link (no shared dnsmasq runs then).
#
# 10.42.0.1 is NetworkManager's fixed shared-mode gateway.
address=/captive.apple.com/10.42.0.1
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/connectivitycheck.android.com/10.42.0.1
address=/clients3.google.com/10.42.0.1
address=/www.msftconnecttest.com/10.42.0.1
address=/ipv6.msftconnecttest.com/10.42.0.1
address=/detectportal.firefox.com/10.42.0.1
address=/connectivity-check.ubuntu.com/10.42.0.1
address=/network-test.debian.org/10.42.0.1
address=/nmcheck.gnome.org/10.42.0.1
